# Golden questions: what "working" means for Rory's tool routing and retrieval.
# Run with: python -m rory.eval          (RAG mode)
#           python -m rory.eval --stuff  (whole knowledge base stuffed into the prompt)
#
# Fields:
#   utterance        - what the user says
#   expect_tool      - tool name that must fire, or null if no tool should fire
#   expect_source    - for search_notes cases: source file(s) that must appear
#                      in the top-3 retrieved chunks (recall@3)
#   must_contain     - substrings (case-insensitive) that must appear in the
#                      final answer
#   must_not_contain - substrings that must NOT appear (used for the refusal
#                      case, to catch invented facts)

- id: relay-retries
  utterance: "What does Relay use to handle retries?"
  expect_tool: search_notes
  expect_source: [PROJECTS.md]
  must_contain: ["exponential backoff"]

- id: relay-persistence-order
  utterance: "In Relay, is the event persisted before or after it's queued?"
  expect_tool: search_notes
  expect_source: [PROJECTS.md]
  must_contain: ["before"]

