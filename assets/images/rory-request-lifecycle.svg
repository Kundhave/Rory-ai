<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="946" viewBox="0 0 1000 946" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Rory request lifecycle: a voice turn flows from click through capture, transcription, agent loop with tool dispatch, speech synthesis and playback.">
<defs>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1000" height="946" fill="#FFFFFF"/>

<text x="60" y="46" font-size="23" font-weight="600" fill="#111827">Rory — Request Lifecycle</text>
<text x="60" y="70" font-size="13.5" fill="#6B7280">One voice turn, end to end</text>

<rect x="310" y="88" width="240" height="48" rx="24" fill="#F1F2F4" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="430" y="118" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">User clicks Rory widget</text>
<line x1="430" y1="136" x2="430" y2="158" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="290" y="160" width="280" height="56" rx="8" fill="#F3E8FF" stroke="#A78BFA" stroke-width="1.2"/>
<text x="430" y="184" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">Capture audio</text>
<text x="430" y="203" font-size="12" fill="#6D28D9" text-anchor="middle">click to stop · 16 kHz mono WAV</text>
<line x1="430" y1="216" x2="430" y2="238" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="290" y="240" width="280" height="56" rx="8" fill="#F3E8FF" stroke="#A78BFA" stroke-width="1.2"/>
<text x="430" y="264" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">Speech to text</text>
<text x="430" y="283" font-size="12" fill="#6D28D9" text-anchor="middle">Sarvam Saaras</text>
<line x1="430" y1="296" x2="430" y2="312" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<polygon points="320,360 430,314 540,360 430,406" fill="#FFF3E0" stroke="#F0A34A" stroke-width="1.2"/>
<text x="430" y="365" font-size="13.5" font-weight="600" fill="#7A4A0F" text-anchor="middle">Transcript usable?</text>

<line x1="320" y1="360" x2="284" y2="360" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>
<text x="302" y="350" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">no</text>
<rect x="60" y="332" width="220" height="56" rx="8" fill="#FDECEC" stroke="#E28B8B" stroke-width="1.2"/>
<text x="170" y="356" font-size="15" font-weight="600" fill="#8B2F2F" text-anchor="middle">Prompt for retry</text>
<text x="170" y="375" font-size="12" fill="#A94848" text-anchor="middle">no LLM call made</text>

<text x="443" y="424" font-size="12" font-weight="600" fill="#6B7280">yes</text>
<line x1="430" y1="406" x2="430" y2="426" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="290" y="428" width="280" height="56" rx="8" fill="#E3F0FC" stroke="#5B9BD5" stroke-width="1.2"/>
<text x="430" y="452" font-size="15" font-weight="600" fill="#10406B" text-anchor="middle">Build message context</text>
<text x="430" y="471" font-size="12" fill="#1F5C96" text-anchor="middle">persona · profile card · history</text>
<line x1="430" y1="484" x2="430" y2="494" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="290" y="496" width="280" height="56" rx="8" fill="#E3F0FC" stroke="#5B9BD5" stroke-width="1.2"/>
<text x="430" y="520" font-size="15" font-weight="600" fill="#10406B" text-anchor="middle">LLM inference</text>
<text x="430" y="539" font-size="12" fill="#1F5C96" text-anchor="middle">Gemini Flash · tool schemas attached</text>
<line x1="430" y1="552" x2="430" y2="572" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<polygon points="320,620 430,574 540,620 430,666" fill="#FFF3E0" stroke="#F0A34A" stroke-width="1.2"/>
<text x="430" y="625" font-size="13.5" font-weight="600" fill="#7A4A0F" text-anchor="middle">Tool call requested?</text>

<line x1="540" y1="620" x2="636" y2="620" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>
<text x="588" y="610" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">yes</text>

<rect x="640" y="592" width="300" height="56" rx="8" fill="#E6F7F0" stroke="#4FB08A" stroke-width="1.2"/>
<text x="790" y="616" font-size="15" font-weight="600" fill="#0B4A38" text-anchor="middle">Validate arguments</text>
<text x="790" y="635" font-size="12" fill="#15705A" text-anchor="middle">JSON schema · whitelist enum</text>
<line x1="790" y1="648" x2="790" y2="670" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="640" y="672" width="300" height="56" rx="8" fill="#E6F7F0" stroke="#4FB08A" stroke-width="1.2"/>
<text x="790" y="696" font-size="15" font-weight="600" fill="#0B4A38" text-anchor="middle">Execute tool</text>
<text x="790" y="715" font-size="12" fill="#15705A" text-anchor="middle">subprocess · psutil · retriever</text>
<line x1="790" y1="728" x2="790" y2="750" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="640" y="752" width="300" height="56" rx="8" fill="#E6F7F0" stroke="#4FB08A" stroke-width="1.2"/>
<text x="790" y="776" font-size="15" font-weight="600" fill="#0B4A38" text-anchor="middle">Return result envelope</text>
<text x="790" y="795" font-size="12" fill="#15705A" text-anchor="middle">ok · data · error</text>

<path d="M940 780 L968 780 L968 524 L576 524" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>
<text x="958" y="510" font-size="12" fill="#6B7280" text-anchor="end">loop · max 4 iterations</text>

<text x="443" y="684" font-size="12" font-weight="600" fill="#6B7280">no</text>
<line x1="430" y1="666" x2="430" y2="688" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="290" y="690" width="280" height="56" rx="8" fill="#E3F0FC" stroke="#5B9BD5" stroke-width="1.2"/>
<text x="430" y="714" font-size="15" font-weight="600" fill="#10406B" text-anchor="middle">Compose grounded reply</text>
<text x="430" y="733" font-size="12" fill="#1F5C96" text-anchor="middle">no unverified claims</text>
<line x1="430" y1="746" x2="430" y2="764" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<path d="M170 388 L170 794 L284 794" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="290" y="766" width="280" height="56" rx="8" fill="#F3E8FF" stroke="#A78BFA" stroke-width="1.2"/>
<text x="430" y="790" font-size="15" font-weight="600" fill="#4C1D95" text-anchor="middle">Text to speech</text>
<text x="430" y="809" font-size="12" fill="#6D28D9" text-anchor="middle">Sarvam Bulbul · cache by hash</text>
<line x1="430" y1="822" x2="430" y2="842" stroke="#4B5563" stroke-width="1.5" marker-end="url(#b)"/>

<rect x="290" y="844" width="280" height="48" rx="24" fill="#F1F2F4" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="430" y="874" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">Play audio · return to idle</text>
</svg>
