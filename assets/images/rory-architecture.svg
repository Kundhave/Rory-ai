<text x="715" y="163" font-size="12" fill="#9A6620" text-anchor="middle">same core · primary dev loop</text>

<line x1="285" y1="192" x2="285" y2="210" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
