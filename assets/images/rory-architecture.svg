<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="812" viewBox="0 0 1000 812" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Rory system architecture: five layers from interface down to external services, with a trust boundary above external side effects.">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#4B5563" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1000" height="812" fill="#FFFFFF"/>

<text x="60" y="46" font-size="23" font-weight="600" fill="#111827">Rory — System Architecture</text>
<text x="60" y="70" font-size="13.5" fill="#6B7280">Decoupled voice agent · V1</text>

<rect x="60" y="88" width="880" height="104" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
