<text x="358" y="661" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">Trust boundary</text>

<rect x="60" y="672" width="880" height="104" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
