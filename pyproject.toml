[project]
name = "rory"
version = "0.1.0"
description = "Rory — a voice-first personal AI assistant."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "google-genai>=0.3",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.26",
    "fastembed>=0.3",
    "psutil>=6.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real external API; excluded from the default run",
]
addopts = "-m 'not live'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rory*"]
